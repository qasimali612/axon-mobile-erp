services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axon_erp}
      POSTGRES_USER: ${POSTGRES_USER:-axon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon_app}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-axon_erp}?schema=public
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      PREVIEW_IFRAME_MODE: "false"
      DEMO_SEED: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/system/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
